<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Armado del ascensor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Maqueta a pantalla completa; a la derecha, la ficha del paso como hoja de taller. En celular, la ficha baja como hoja inferior. */
:root{
  --bg:#dfe5e1; --ink:#15211d; --muted:#586a63; --panel:rgba(255,255,255,.94);
  --line:#ccd7d1; --chip:#edf2ef; --accent:#ea580c; --accent-ink:#ffffff; --warn-bg:#fff4e8; --warn:#b45309;
  --shadow:0 10px 30px rgba(20,40,32,.16);
  --f-display:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111916; --ink:#e6eeea; --muted:#94a69e; --panel:rgba(24,34,30,.95);
    --line:#2c3b35; --chip:#22302a; --accent:#fb7a2e; --accent-ink:#1b0c02; --warn-bg:#2d2114; --warn:#f6ad55;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111916; --ink:#e6eeea; --muted:#94a69e; --panel:rgba(24,34,30,.95);
  --line:#2c3b35; --chip:#22302a; --accent:#fb7a2e; --accent-ink:#1b0c02; --warn-bg:#2d2114; --warn:#f6ad55;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-display);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;padding-inline:16px;text-align:center}

.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;pointer-events:none;max-width:30ch}
.brand h1{margin:0;font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.brand p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.35}

.info{position:absolute;left:16px;bottom:16px;max-width:min(320px,calc(100% - 32px));background:var(--panel);border-radius:14px;box-shadow:var(--shadow);
  padding:11px 38px 11px 14px;border-left:4px solid var(--accent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.info b{display:block;font-size:15px;margin-bottom:2px}
.info span{font-size:13.5px;line-height:1.4;color:var(--muted)}
.info button{position:absolute;top:6px;right:6px;border:0;background:transparent;width:28px;height:28px;border-radius:8px;font-size:18px;color:var(--muted)}

.panel{position:absolute;top:16px;right:16px;bottom:16px;width:380px;display:flex;flex-direction:column;background:var(--panel);border-radius:18px;
  box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
.track{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;padding:14px 16px 0}
.track button{border:0;height:8px;border-radius:4px;background:var(--line);padding:0}
.track button.done{background:var(--ink);opacity:.55}
.track button[aria-current="step"]{background:var(--accent);opacity:1}
.head{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.kicker{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.head h2{margin:4px 0 0;font-size:26px;line-height:1.08;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.body{flex:1;overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.body ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.body li{font-size:14.5px;line-height:1.45}
.body li::marker{color:var(--accent);font-weight:700}
.warn{background:var(--warn-bg);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.warn b{color:var(--warn)}
.pieces{display:flex;flex-wrap:wrap;gap:6px}
.pieces span{background:var(--chip);border-radius:8px;padding:5px 9px;font-size:13px}
.plabel{font-size:12.5px;color:var(--muted);margin-bottom:-4px}
.nav{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nav button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px}
#prev{background:var(--chip)}
#next{flex:1;background:var(--accent);color:var(--accent-ink)}
#prev:disabled{opacity:.4;cursor:default}
.tip{font-size:12.5px;color:var(--muted)}
.body li b{font-weight:700}
.tw{overflow-x:auto}
.tplbtn{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:#ffffff;border-radius:12px;padding:8px;text-align:center}
.tplbtn img{display:block;width:100%;height:auto;border-radius:6px}
.tplbtn span{font-size:12.5px;font-weight:600;color:#c2410c}
.zoom{position:fixed;inset:0;z-index:10;background:rgba(10,16,14,.82);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.zbar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#ffffff;padding-bottom:10px;font-size:16px}
.zbar button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:#ffffff;color:#15211d}
.zimg{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;background:#ffffff;border-radius:12px}
.zimg img{max-width:100%;max-height:100%;object-fit:contain}
@media (max-width:760px){.zimg{align-items:flex-start;justify-content:flex-start}.zimg img{max-width:none;max-height:none;width:1100px}}
.cuts{width:100%;border-collapse:collapse;font-size:13px}
.cuts th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.cuts td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.cuts .lt{font-weight:800;color:var(--accent)}
.cuts .num{white-space:nowrap;font-variant-numeric:tabular-nums}
.glos{border-top:1px solid var(--line);padding-top:10px}
.glos summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent)}
.glos dl{margin:8px 0 0;display:grid;gap:6px}
.glos dt{font-weight:700;font-size:13.5px}
.glos dd{margin:0 0 4px;font-size:13.5px;line-height:1.4;color:var(--muted)}

@media (max-width:760px){
  .brand h1{font-size:19px}
  .brand p{display:none}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:48%}
  .head h2{font-size:21px}
  .info{bottom:auto;top:calc(56px + env(safe-area-inset-top,0px));left:12px}
  .tip{display:none}
}
</style>

<canvas id="scene" aria-label="Maqueta 3D del ascensor. Arrastrá para girar."></canvas>
<div class="loading" id="loading">Cargando la maqueta…</div>

<header class="brand">
  <h1>Armado del ascensor</h1>
  <p>Arrastrá para girar, pellizcá para acercar. Tocá una pieza para ver qué es.</p>
</header>

<div class="info" id="info" hidden role="status"><b id="infoT"></b><span id="infoD"></span><button id="infoX" aria-label="Cerrar">×</button></div>

<div class="zoom" id="zoom" hidden role="dialog" aria-label="Plantilla de cortes">
  <div class="zbar"><b>Plantilla de cortes</b><button id="zoomX">Cerrar</button></div>
  <div class="zimg"><img id="zoomImg" alt="Plantilla de cortes: cómo acomodar todas las piezas en los dos pliegos de cartón pluma de 70 × 50 cm"></div>
</div>

<section class="panel" id="panel" aria-label="Pasos de armado">
  <nav class="track" id="track" aria-label="Pasos"></nav>
  <div class="head">
    <div class="kicker"><span id="kStep"></span><span id="kPart"></span></div>
    <h2 id="sTitle"></h2>
  </div>
  <div class="body" id="sBody"></div>
  <div class="nav">
    <button id="prev">Anterior</button>
    <button id="next">Siguiente</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE || !THREE.OrbitControls) { $('#loading').textContent = 'No se pudo cargar el visor 3D. Revisá tu conexión y recargá la página.'; return; }
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* cada pieza recuerda en qué paso se agrega */
let CUR = -1;
const ST = n => { CUR = n; };
const _add = THREE.Object3D.prototype.add;
THREE.Object3D.prototype.add = function(...objs){
  if (CUR >= 0) objs.forEach(o => { if (o && o.userData && o.userData.step === undefined) o.userData.step = CUR; });
  return _add.apply(this, objs);
};

/* ---------- escena ---------- */
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
function applyBg(){ scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#dfe5e1'); }
applyBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyBg);

const camera = new THREE.PerspectiveCamera(36, 1, 1, 1200);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 260;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xffffff, 0x40524b, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(45, 85, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-55, right:55, top:65, bottom:-45, near:10, far:260});
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(-60, 35, -45);
scene.add(fill);

/* ---------- utilidades (1 unidad = 1 cm) ----------
   x: 0..45 de izquierda a derecha de la base
   h: altura sobre la base
   d: 0 (frente) .. 30 (atrás) */
const X = x => x - 22.5, Z = d => 15 - d;
const std = (c, r, m) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m || 0});
const M = {
  foam: std(0xf4f4f0, .92), foam2: std(0xe9e9e4, .92),
  rod: std(0x7d848b, .32, .9), steel: std(0xbfc4c9, .3, .9), copper: std(0xc4722c, .32, .85),
  alu: std(0xd3d7db, .28, .85), belt: std(0x202023, .85), motor: std(0xb3bbc2, .38, .75),
  motorCap: std(0x2e63c8, .55), pcbBlue: std(0x1a5ea8, .55), pcbGreen: std(0x1f6a3b, .6),
  black: std(0x1c1c1e, .55), white: std(0xf7f7f4, .7), cabin: std(0xfccf9c, .85), cabinIn: std(0xfff0dd, .9),
  clip: std(0x141416, .35, .6), silicone: new THREE.MeshStandardMaterial({color:0xffffff, roughness:.2, transparent:true, opacity:.55}),
  btnBody: std(0x2a2a2d, .5), term: std(0x2f8a4e, .6), cream: std(0xfff7e8, .8), marker: std(0x222222, .8), red: std(0xd33a2c, .5)
};
const shadow = m => { m.castShadow = true; m.receiveShadow = true; return m; };
function box(x1, x2, h1, h2, d1, d2, mat, info, parent){
  const m = shadow(new THREE.Mesh(new THREE.BoxGeometry(x2 - x1, h2 - h1, d2 - d1), mat));
  m.position.set(X((x1 + x2) / 2), (h1 + h2) / 2, Z((d1 + d2) / 2));
  if (info) m.userData.info = info;
  (parent || scene).add(m); return m;
}
function cylY(x, d, h1, h2, r, mat, info, parent, seg){
  const m = shadow(new THREE.Mesh(new THREE.CylinderGeometry(r, r, h2 - h1, seg || 24), mat));
  m.position.set(X(x), (h1 + h2) / 2, Z(d));
  if (info) m.userData.info = info;
  (parent || scene).add(m); return m;
}
function cylZ(x, h, d1, d2, r, mat, info, parent, seg){
  const g = new THREE.CylinderGeometry(r, r, d2 - d1, seg || 28); g.rotateX(Math.PI / 2);
  const m = shadow(new THREE.Mesh(g, mat));
  m.position.set(X(x), h, Z((d1 + d2) / 2));
  if (info) m.userData.info = info;
  (parent || scene).add(m); return m;
}
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.userData = {canvas:c, ctx:g};
  return t;
}
const FONT = "'Bricolage Grotesque', system-ui, sans-serif";

function pbTex(wcm, hcm, o){
  o = o || {};
  const k = 48;
  return canvasTex(Math.round(wcm * k), Math.round(hcm * k), (g, w, h) => {
    g.fillStyle = '#f8f8f5'; g.fillRect(0, 0, w, h);
    const p = 0.254 * k;
    g.fillStyle = '#e2e2dc'; g.fillRect(0, h / 2 - .12 * k, w, .24 * k);
    g.fillStyle = '#4a4a4a';
    const hole = (x, y) => g.fillRect(x - 1.7, y - 1.7, 3.4, 3.4);
    const cols = Math.floor((w - .3 * k) / p);
    const x0 = (w - cols * p) / 2 + p / 2;
    for (let i = 0; i < cols; i++) for (let r = 0; r < 5; r++) {
      hole(x0 + i * p, h / 2 - .3 * k - r * p); hole(x0 + i * p, h / 2 + .3 * k + r * p);
    }
    if (o.rails) {
      [[.18, '#d33a2c'], [h / k - .18, '#2563eb']].forEach(([yc, col]) => {
        const y = yc * k;
        g.fillStyle = col; g.fillRect(.2 * k, y - (yc < 1 ? -.02 : .02) * k - 1, w - .4 * k, 2);
      });
      g.fillStyle = '#4a4a4a';
      for (let i = 0; i < cols; i += 1) { if (i % 6 === 5) continue; hole(x0 + i * p, .4 * k); hole(x0 + i * p, .4 * k + p); hole(x0 + i * p, h - .4 * k); hole(x0 + i * p, h - .4 * k - p); }
    }
    if (o.draw) o.draw(g, k, w, h);
  });
}

/* ---------- la maqueta ---------- */
const I = (t, d) => ({t, d});
const INFO = {
  base: I('Base A', 'Dos piezas de 45 × 30 cm pegadas una encima de otra: queda de 1 cm de grueso.'),
  B: I('Panel trasero B', '20 × 48 cm. La línea del centro guía el motor, las dos poleas y la faja.'),
  C: I('Lateral C', '10 × 48 cm. En el derecho van por fuera los botones de pasillo y las etiquetas de piso.'),
  D: I('Techo D', '20.5 × 10.5 cm. Las dos varillas lo atraviesan.'),
  E: I('Tablero E', '20 × 10 cm, parado en la esquina de adelante. Tiene la ventana del LCD y los botones de cabina.'),
  F: I('Escuadra F', 'Triángulo de 8 × 8 cm que sostiene el tablero por detrás.'),
  rod: I('Varilla de hierro liso 1/4"', 'Tramo de 50 cm, lijado con grano 400. Es el riel: la cabina desliza por ella.'),
  guide: I('Guía de cobre 3/8"', 'Pedazo de 3 cm pegado al costado de la cabina. La varilla pasa por dentro.'),
  cabin: I('Cabina (G, H, I)', 'Cajita de 10 × 7 × 6 cm con el frente abierto.'),
  J: I('Pestaña J', '2 × 3.5 cm, pegada atrás de la cabina. Aquí se engancha la faja.'),
  clip: I('Clip binder de 19 mm', 'Aprieta el lado derecho de la faja contra la pestaña J. Así la faja arrastra la cabina.'),
  belt: I('Faja GT2 de 852 mm', 'Lazo cerrado de 6 mm de ancho. Solo el lado derecho va enganchado a la cabina.'),
  pulleyTop: I('Polea GT2 de 30 dientes (arriba)', 'Fija al eje del motor con sus dos tornillitos, a 1 mm del motor.'),
  pulleyBot: I('Polea GT2 de 30 dientes (abajo)', 'Sin tornillitos: gira libre sobre el tornillo M5 con una gota de aceite.'),
  bolt: I('Tornillo M5 con 3 tuercas', 'La tuerca 2 ajusta la distancia para que las dos poleas queden en el mismo plano.'),
  K: I('Cuadritos K', '3 × 3 cm. Refuerzan el cartón donde entra el tornillo.'),
  motor: I('Motor 28BYJ-48 de 5 V', 'Eje a 44 cm de la base, sobre la línea del centro de B.'),
  L: I('Repisa L (6 × 2 cm)', 'El motor se sienta sobre ella. Si sobresale más de 2 cm de B, roza la faja.'),
  driver: I('Driver ULN2003', 'Pegado atrás de B por las esquinas. Se alimenta con la fuente de 5 V, nunca con la de 9 V.'),
  lowSw: I('Final de carrera de abajo', 'Torrecita de 8 cuadritos K con un botón. El tacón de la cabina lo aprieta en el piso 1 (pin 35).'),
  topSw: I('Final de carrera de arriba', 'Cuelga del techo con 2 cuadritos K. El tacón de arriba lo aprieta en el piso 4 (pin 36).'),
  label: I('Etiqueta de piso M', '4 × 2.5 cm, pegada sobre la línea de marcador de cada piso.'),
  lcd: I('LCD 16x2 con módulo I2C', 'Pines 20 (SDA) y 21 (SCL). Muestra piso, dirección, modo y pisos recorridos.'),
  pbCab: I('Protoboard de los botones de cabina', 'Destinos 1 a 4 (pines 30 a 33) y MODO (pin 34).'),
  mega: I('Arduino Mega 2560', 'Se alimenta por USB o con el adaptador Elegoo de 9 V en su jack.'),
  pbMain: I('Protoboard principal', 'La fila azul es la tierra común (GND) de los 13 botones.'),
  psu: I('Fuente de 5 V 2 A con bornera', 'Alimenta solo al driver del motor. Su negativo va también a la fila GND.'),
  adapter: I('Adaptador Elegoo de 9 V', 'Va solo al jack del Mega. Nunca al driver del motor.'),
  tacon: I('Tacón de 1 × 1 × 2 cm', 'Bloquecito de cartón pluma pegado a la cabina sobre el botón. Aprieta el botón y deja libres los cables.'),
  wire: I('Jumper', 'Todos los botones van con la señal y el GND en diagonal.')
};

function build(){
  ST(0);
  const matTex = canvasTex(1080, 780, (g, w, h) => {
    const k = 12;
    g.fillStyle = '#2d5b4d'; g.fillRect(0, 0, w, h);
    for (let i = 0; i <= 90; i++) { g.strokeStyle = i % 10 === 0 ? 'rgba(255,255,255,.34)' : i % 5 === 0 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.07)'; g.lineWidth = i % 10 === 0 ? 2 : 1; g.beginPath(); g.moveTo(i * k + .5, 0); g.lineTo(i * k + .5, h); g.stroke(); }
    for (let j = 0; j <= 65; j++) { g.strokeStyle = j % 10 === 0 ? 'rgba(255,255,255,.34)' : j % 5 === 0 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.07)'; g.lineWidth = j % 10 === 0 ? 2 : 1; g.beginPath(); g.moveTo(0, j * k + .5); g.lineTo(w, j * k + .5); g.stroke(); }
    g.strokeStyle = 'rgba(255,214,102,.28)'; g.lineWidth = 1.5;
    for (let a = -h; a < w; a += 240) { g.beginPath(); g.moveTo(a, h); g.lineTo(a + h, 0); g.stroke(); }
  });
  const matSide = std(0x24493e, .9);
  const mat = new THREE.Mesh(new THREE.BoxGeometry(90, .3, 65), [matSide, matSide, new THREE.MeshStandardMaterial({map:matTex, roughness:.95}), matSide, matSide, matSide]);
  mat.position.set(0, -1.15, 1); mat.receiveShadow = true; scene.add(mat);

  ST(2);
  box(0, 45, -1, -.5, 0, 30, M.foam2, INFO.base);
  box(0, 45, -.5, 0, 0, 30, M.foam, INFO.base);
  { const pen = std(0x7d848b, .9); box(23, 43, 0, .02, 9.42, 9.58, pen); box(23, 43, 0, .02, 19.92, 20.08, pen); box(22.92, 23.08, 0, .02, 9.5, 20, pen); box(42.92, 43.08, 0, .02, 9.5, 20, pen); }

  ST(3);
  box(23, 43, 0, 48, 19.5, 20, M.foam, INFO.B);
  box(23, 23.5, 0, 48, 9.5, 19.5, M.foam, INFO.C);
  box(42.5, 43, 0, 48, 9.5, 19.5, M.foam, INFO.C);
  ST(6); box(22.75, 43.25, 48, 48.5, 9.5, 20, M.foam, INFO.D); ST(3);
  // línea del centro a lápiz
  box(32.97, 33.03, 1, 47.5, 19.49, 19.5, std(0x9aa0a6, .9), INFO.B);

  ST(5);

function makePulley(h, hubToMotor, info){

  const hub = add(new THREE.CylinderGeometry(.62, .62, .7, 28), M.alu); hub.position.z = -.77;
  const scr = new THREE.Mesh(new THREE.BoxGeometry(.22, .25, .22), M.black); scr.position.set(0, .6, -.77); g.add(scr);
  const bore = new THREE.Mesh(new THREE.CircleGeometry(.26, 16), M.black); bore.position.z = .43; g.add(bore);

  scene.add(g); return g;

function makeButton(pos, face, color, data){
  const g = new THREE.Group();
  const body = shadow(new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, .36), M.btnBody)); body.position.z = .18;
  const capMat = new THREE.MeshStandardMaterial({color, roughness:.45, emissive:color, emissiveIntensity:0});
  const cg = new THREE.CylinderGeometry(.47, .47, .34, 24); cg.rotateX(Math.PI / 2);
  const cap = shadow(new THREE.Mesh(cg, capMat)); cap.position.z = .53;
  body.userData = data; cap.userData = data;
  g.add(body, cap);
  if (face === 'x') g.rotation.y = Math.PI / 2;
  if (face === 'y') g.rotation.x = -Math.PI / 2;
  if (face === '-y') g.rotation.x = Math.PI / 2;
  g.position.copy(pos); scene.add(g);
  return {g, cap, capMat, t:0};
}
function arrow(x, h, d, up){
  const s = new THREE.Shape(); const k = .38;
  if (up) { s.moveTo(-k, -k * .6); s.lineTo(k, -k * .6); s.lineTo(0, k * .7); } else { s.moveTo(-k, k * .6); s.lineTo(k, k * .6); s.lineTo(0, -k * .7); }
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({color:up ? 0x1f9d55 : 0xd42f2f}));
  m.rotation.y = Math.PI / 2; m.position.set(X(x), h, Z(d)); scene.add(m);
}

       'En la pared de atrás B dibujá con lápiz una línea vertical justo a la mitad: a 10 cm de cada orilla. Es la línea más importante: sobre ella van el motor, las poleas y la faja.',
       'Pegá la pared B parada sobre la línea de atrás del rectángulo, con la línea dibujada mirando hacia adelante. Apoyala contra un libro parado mientras se enfría para que quede derecha.',
       'Pegá una pared C a cada lado de B: paradas sobre la base, pegadas a las orillas de B.',
       'Pasá un cordón de silicón por dentro de cada esquina donde se juntan dos paredes. Eso es lo que la hace firme.'],
   warn:'Todavía <b>no</b> pongás el techo. Primero tienen que entrar las varillas y la cabina.',
   pc:['Pared trasera B (20 × 48 cm)','2 paredes C (10 × 48 cm)'],
   lab:[{t:'Pared trasera (B)', p:[33,32,19.5]},{t:'Pared del lado (C)', p:[23,26,12]},{t:'Pared del lado (C)', p:[43,26,12]},{t:'Línea del centro', p:[33,16,19.4]}]},

  {t:'El motor', p:'Parte 3 del manual', cab:10, cam:[[30,52,26],[10.5,41.5,-3]],
   do:['Meté una polea (la rueda de aluminio con dientes) en el eje del motor. Debe quedar a 1 mm del motor, sin tocarlo.',
       'La polea tiene dos tornillitos. Girala hasta que uno quede frente a la parte plana del eje y apretalo con la llave Allen. Después apretá el otro.',
       'Sobre la línea del centro, medí <b>44 cm</b> desde la base hacia arriba. Ahí va el centro del eje del motor.',
       'Justo debajo, pegá la repisa L (6 × 2 cm) acostada contra la pared, como un estante.',
       'Pegá el motor sentado sobre la repisa: la tapa plana contra la pared y el eje (con la polea) apuntando hacia vos.',
       'Al lado del motor, cortá en la pared un agujerito de 1.5 × 1 cm. Pasá por ahí el cable del motor hacia atrás.',
       'Por detrás de la pared, a unos 40 cm de alto, pegá la plaquita verde del driver (silicón solo en sus 4 esquinas) y enchufale el cable del motor.',
       'Medí con la regla desde la pared hasta la mitad de los dientes de la polea. Debe dar unos 3 cm. <b>Anotalo: es la medida X</b>, la vas a usar dos veces.'],
   warn:'<b>Cambio al manual:</b> la repisa L es de 6 × 2 cm, no de 6 × 4. Si sobresale más, la faja la roza.',
   pc:['Motor 28BYJ-48','Driver ULN2003 (plaquita verde)','Polea GT2','Repisa L (6 × 2 cm)'],
   lab:[{t:'Motor', p:[38,43.4,18.5]},{t:'Polea de arriba', p:[33,45.4,16.4]},{t:'Repisa L', p:[29.5,41.6,18.5]},{t:'Driver (detrás de la pared)', p:[31.6,37.4,20.2]}]},

  {t:'Las varillas y la cabina', p:'Partes 4 y 5 del manual', cab:10, cam:[[38,40,46],[10.5,24,1]],
   do:['Las 2 varillas de hierro son los rieles. Lijalas con lija de agua hasta que queden lisas. Rodalas en el piso: si tambalean, están torcidas y hay que cambiarlas.',
       'Armá la cabina como una cajita sin frente: una G de piso, una I parada a cada lado, la H parada atrás y la otra G de techo. Queda de 10 cm de ancho, 7 de fondo y 6 de alto.',
       'A cada costado de la cabina van 2 pedacitos de tubo de cobre, uno arriba del otro, a <b>3.5 cm</b> de la pared de atrás. Por dentro de esos tubos pasa la varilla.',
       'Truco para que queden rectos: meté los 2 tubos en una varilla, apoyala contra el costado de la cabina y pegá los tubos con la varilla adentro. Esperá 3 minutos y sacá la varilla. Que no caiga silicón dentro del tubo.',
       'Atrás de la cabina, por fuera, pegá la pestaña J (2 × 3.5 cm) parada, a 1.5 cm a la derecha del centro. Ahí se va a enganchar la faja.',
       'De la tira N cortá un pedazo de ancho igual a la medida X más 0.8 cm (si X dio 3 cm, cortá 3.8 cm). Ese pedazo es el <b>calibre</b>: un separador.',
       'Pasá las varillas por los tubos y meté la cabina dentro de la torre. Poné el calibre parado entre la pared de atrás y la cabina, centrá la cabina y empujá cada varilla girándola hasta que se hunda 5 mm en la base.'],
   pc:['2 varillas de hierro 1/4" (50 cm)','4 tubos de cobre 3/8" (3 cm)','Cabina: 2 G, 1 H, 2 I','Pestaña J','Calibre (de la tira N)'],
   lab:[{t:'Varilla (riel)', p:[27.3,44,12.2]},{t:'Varilla (riel)', p:[38.7,34,12.2]},{t:'Cabina', p:[29,14,9], cab:1},{t:'Tubo de cobre', p:[26.8,9,12.2], cab:1},{t:'Pestaña J', p:[35.2,9.4,17.7], cab:1}]},

  {t:'El techo', p:'Parte 5 del manual', cab:10, cam:[[40,64,50],[10.5,40,0]],
   do:['El techo es la pieza D (20.5 × 10.5 cm). Va encima de las tres paredes.',
       'Ponelo encima de la torre <b>sin pegar</b> y marcá con lápiz dónde tocan las puntas de las dos varillas.',
       'Atravesá el techo en esas dos marcas con la punta de una varilla o de un lápiz.',
       'Bajalo por las varillas hasta que apoye sobre las paredes y pegalo.',
       'Subí y bajá la cabina con la mano 20 veces. Poné una gota de aceite en cada varilla y repetí.'],
   warn:'Si la cabina se traba en algún punto, una varilla está chueca. Despegala, enderezala y volvé a pegar ahora; después cuesta mucho más.',
   pc:['Techo D (20.5 × 10.5 cm)'],
   lab:[{t:'Techo (D)', p:[30,48.5,11]}]},

  {t:'La polea de abajo y la faja', p:'Parte 6 del manual', cab:10, cam:[[26,16,24],[10.5,6,-1]],
   do:['La faja es un aro de hule con dientes. Colgala de la polea del motor con los dientes hacia adentro. Queda colgando entre la cabina y la pared de atrás.',
       'El lado derecho de la faja debe pasar pegadito a la pestaña J de la cabina, por su izquierda.',
       'Meté la segunda polea dentro del aro, abajo, y jalala suave hasta que la faja quede recta. Marcá en la pared el centro de la polea (queda a unos 4 cm de la base). Hacé la marca <b>2 mm más abajo</b>: así la faja queda tensa.',
       'Pegá un cuadrito K (3 × 3 cm) sobre la marca, por delante de la pared, y otro por detrás. Así el tornillo no rompe el cartón.',
       'Atravesá todo con el tornillo, metiéndolo desde atrás con una rondana (arandela). Por delante: otra rondana y la <b>tuerca 1</b>, bien apretada.',
       'Enroscá la <b>tuerca 2</b> y girala hasta que la polea de abajo quede a la misma distancia de la pared que la de arriba (la medida X).',
       'A esta polea quitale los dos tornillitos: tiene que girar libre. Poné una gota de aceite en el tornillo, metela con la faja alrededor y cerrá con la <b>tuerca 3</b>, dejando 1 mm de juego.'],
   warn:'Apretá la faja a media altura con un dedo: tiene que ceder entre 3 y 5 mm. Muy floja, se salta los dientes; muy tensa, el motor sufre.',
   pc:['Polea GT2','Faja GT2 de 852 mm','Tornillo M5 × 50 mm','3 tuercas y 2 rondanas','2 cuadritos K (3 × 3 cm)'],
   lab:[{t:'Polea de abajo', p:[33,5.8,16]},{t:'Faja', p:[33.95,24,16.5]},{t:'Tornillo y tuercas', p:[33,3.6,17.2]},{t:'Cuadrito de refuerzo', p:[31.5,6,19.1]}]},

  {t:'El botón de abajo (final de carrera)', p:'Parte 7 del manual', cab:0, cam:[[30,13,27],[13.5,5,3.5]],
   do:['Un <b>final de carrera</b> es un botón que la cabina aprieta cuando llega abajo. Así el Arduino sabe dónde está el piso 1 cada vez que se enciende.',
       'Pegá <b>8 cuadritos K</b> (3 × 3 cm) uno encima del otro. Queda una torrecita de 4 cm.',
       'Poné un botón en una mini protoboard, cruzando la ranura del medio. Conectale sus dos cables <b>en diagonal</b> (dibujo del manual, Parte 7), saliendo hacia el frente.',
       'Quitale el papel del adhesivo a la mini protoboard y pegala encima de la torrecita, con el botón hacia arriba.',
       'Pegá la torrecita adentro de la torre, debajo de la cabina, un poco a la derecha y hacia el frente. No puede tocar las varillas ni la faja.',
       'Hacé un <b>tacón</b>: pegá 2 tiras de 1 × 2 cm una sobre otra. Pegalo debajo del piso de la cabina, justo encima del botón.',
       'Bajá la cabina con la mano: el tacón tiene que apretar el botón y hacer clic.'],
   warn:'<b>Cambio al manual:</b> son 8 cuadritos, no 12. El tacón es el que aprieta el botón; así la cabina no choca con los cables.',
   pc:['8 cuadritos K (3 × 3 cm)','Mini protoboard','1 botón 12 × 12 mm','Tacón (2 tiras de 1 × 2 cm)'],
   lab:[{t:'Torrecita de 8 cuadritos', p:[38,2,10]},{t:'Botón', p:[34.9,5.2,10]},{t:'Tacón', p:[37.2,6.8,11.25], cab:1}]},

  {t:'El tablero de control', p:'Parte 8 del manual', cab:10, cam:[[-6,16,40],[-11.5,5,13]],
   do:['El tablero E (20 × 10 cm) va parado en la esquina de adelante a la izquierda de la base, a 1 cm de cada orilla.',
       'Por detrás, pegá los dos triángulos F como escuadras para que no se vaya para atrás.',
       'Cortá en el tablero una ventana de 7.2 × 2.6 cm, centrada y a 1.5 cm del borde de arriba. Pegá la pantalla por detrás, con el vidrio asomándose. Silicón solo en las orillas de la placa verde.',
       'Pegá una protoboard debajo de la ventana (trae adhesivo atrás). Poné 5 botones cruzando la ranura del medio: 4 juntos a la izquierda (pisos 1, 2, 3 y 4) y uno separado a la derecha (MODO).',
       'Escribí con marcador el número debajo de cada botón.'],
   pc:['Tablero E (20 × 10 cm)','2 escuadras F','Pantalla LCD con I2C','Protoboard 830','5 botones'],
   lab:[{t:'Tablero (E)', p:[2.5,9.6,1.5]},{t:'Pantalla', p:[11,8.9,1.2]},{t:'Botones 1, 2, 3 y 4', p:[10.2,1.9,0.4]},{t:'MODO', p:[14.35,4.2,0.4]},{t:'Escuadra (F)', p:[4,5.5,5]}]},

  {t:'El Arduino', p:'Parte 9 del manual', z:2.1, cab:10, cam:[[-30,26,-30],[-9,1,-10]],
   do:['Toda la electrónica va sobre la base, detrás de la torre.',
       'Pegá el Arduino Mega a la izquierda, con cuatro puntitos de silicón debajo de sus esquinas y el conector USB hacia la orilla.',
       'Pegá la protoboard principal a la derecha del Arduino, con su adhesivo.',
       'Más a la derecha, detrás de la torre, pegá la bornera de la fuente de 5 V (la pieza verde con tornillitos donde se aprietan los cables). Si usan pilas, ahí va el porta pilas.',
       'Con un cable, uní un pin GND del Arduino a la <b>fila azul</b> (−) de la protoboard. Esa fila es la tierra: todos los botones van a terminar ahí.'],
   warn:'Si la línea azul de tu protoboard se corta a la mitad, la fila también está cortada. Uní las dos mitades con un cable corto.',
   pc:['Arduino Mega 2560','Protoboard 830 (principal)','Bornera de la fuente 5 V'],
   lab:[{t:'Arduino Mega', p:[7,0.8,24.6]},{t:'Protoboard principal', p:[17.6,1.2,24.7]},{t:'Bornera 5 V', p:[40.6,1.4,24.2]}]},

  {t:'El botón de arriba (final de carrera)', p:'Parte 12 del manual', cab:30, cam:[[30,58,30],[13,45,2]],
   do:['Es igual al de abajo, pero colgado del techo: la cabina lo aprieta al llegar al piso 4.',
       'Subí la cabina con la mano hasta arriba.',
       'Pegá <b>2 cuadritos K</b> uno debajo del otro, colgando del techo por dentro, justo arriba de donde está la torrecita de abajo.',
       'Pegá debajo la mini protoboard con su botón y sus cables, con el botón mirando hacia abajo.',
       'Hacé el segundo tacón y pegalo encima del techo de la cabina, justo debajo del botón.'],
   warn:'<b>Cambio al manual:</b> solo 2 cuadritos. El espacio que queda es para los cables.',
   pc:['2 cuadritos K (3 × 3 cm)','Mini protoboard','1 botón 12 × 12 mm','Tacón (2 tiras de 1 × 2 cm)'],
   lab:[{t:'Botón de arriba', p:[34.9,46.2,10]},{t:'2 cuadritos', p:[38.3,47.6,10.5]},{t:'Tacón', p:[37.2,14.8,11.25], cab:1}]},

  {t:'Los botones de cada piso', p:'Parte 12 del manual', cab:10, cam:[[62,32,14],[20.5,22,-1]],
   do:['Los botones de pasillo son los que usa la gente en cada piso para llamar al ascensor. Van por fuera, en la pared del lado derecho.',
       'Bajá la cabina hasta abajo. Con marcador, trazá una línea por fuera de la pared derecha, a la altura del piso de la cabina.',
       'Repetí cada <b>10 cm</b> hacia arriba: 4 líneas en total, una por piso.',
       'Pegá encima de cada línea su etiqueta M (4 × 2.5 cm): PISO 1, PISO 2, PISO 3 y PISO 4.',
       'Arriba de cada línea pegá una mini protoboard con sus botones. Piso 1: solo SUBIR. Pisos 2 y 3: SUBIR a la izquierda y BAJAR a la derecha. Piso 4: solo BAJAR.'],
   warn:'Estas líneas son provisionales. Cuando el motor ya esté calibrado (último paso), corregilas para que coincidan con donde de verdad se detiene la cabina.',
   pc:['4 etiquetas M (4 × 2.5 cm)','4 mini protoboards','6 botones'],
   lab:[{t:'Botones del piso 3', p:[43.9,31.5,16.7]},{t:'Etiqueta de piso', p:[43.06,39.6,11.9]},{t:'Línea del piso', p:[43,17.6,13.5]}]},

  {t:'Los cables', p:'Parte 9 del manual', cab:10, cam:[[-12,42,-72],[5,15,-2]],
   do:['Todos los cables son jumpers: se enchufan, no se sueldan. Si uno no alcanza, alargalo con un jumper macho-hembra.',
       'Cada botón lleva 2 cables <b>en diagonal</b>: uno va a su pin del Arduino (la señal) y el otro a la fila azul (la tierra o GND).',
       '<b>Pasillo:</b> piso 1 subir al pin 22, piso 2 subir al 23, piso 2 bajar al 24, piso 3 subir al 25, piso 3 bajar al 26 y piso 4 bajar al 27.',
       '<b>Tablero:</b> botones 1, 2, 3 y 4 a los pines 30, 31, 32 y 33. MODO al pin 34.',
       '<b>Finales de carrera:</b> el de abajo al pin 35 y el de arriba al 36.',
       '<b>Driver:</b> IN1, IN2, IN3 e IN4 a los pines 8, 9, 10 y 11, en ese orden. Su + y su − a los tornillos + y − de la bornera.',
       'Un cable más, del tornillo − de la bornera a la fila azul.',
       '<b>Pantalla:</b> GND a GND, VCC a 5V, SDA al pin 20 y SCL al pin 21.',
       'Pegá los cables a las paredes con masking tape, lejos de la faja. Ponele a cada uno una banderita de tape con su nombre.'],
   warn:'La guía de cableado 3D muestra cada conexión una por una, con el pin exacto.',
   pc:['Jumpers macho-macho','Jumpers macho-hembra','Masking tape'],
   lab:[{t:'Cables de los pisos (por fuera)', p:[44.6,24,19.6]},{t:'Cables del driver', p:[30.2,26,20.6]},{t:'Cables del tablero', p:[6,0.6,14]}]},

  {t:'Probar el motor y enganchar', p:'Partes 11 y 12 del manual', cab:10, cam:[[48,40,58],[6,20,0]],
   do:['Primero, con la cabina <b>sin enganchar</b> (sostenida con masking tape a media altura), pintá con marcador una rayita en el lado derecho de la faja.',
       'Conectá la laptop por USB y subí el código. La pantalla dice "Calibrando..." y el motor gira. Mirá la rayita.',
       'Si la rayita <b>baja</b>, todo bien. Si <b>sube</b>, desconectá el USB de inmediato y en el código cambiá INVERTIR_MOTOR = false por true.',
       'Ahora sí, enganchá la cabina: el clip aprieta juntos el lado derecho de la faja y la pestaña J, con una gota de silicón en medio.',
       'Para usarlo sin laptop: el adaptador de 9 V va al conector redondo del Arduino y la fuente de 5 V a la bornera.'],
   warn:'<b>Ojo:</b> el adaptador de 9 V va solo al Arduino. Nunca al driver: el motor es de 5 V y se quema.',
   pc:['Clip binder de 19 mm','Fuente 5 V 2 A','Adaptador 9 V'],
   lab:[{t:'Clip: faja + pestaña J', p:[34.3,11.8,18], cab:1},{t:'Adaptador 9 V (al Arduino)', p:[-10,1.6,30]},{t:'Fuente 5 V (a la bornera)', p:[36,-.6,33]}]},

  {t:'¡Listo!', p:'Parte 13 del manual', z:1.05, cab:null, cam:[[58,46,80],[3,21,0]],
   do:['Al encenderlo, la cabina baja sola hasta apretar el botón de abajo. Ese es el piso 1.',
       'Apretá el botón 2 del tablero y medí con una regla cuánto subió la cabina. Debe ser 10 cm.',
       'Si no dio 10 cm, calculá 6827 × 10 ÷ lo que midió. Poné ese número en PASOS_PISO, en el código, y subilo de nuevo.',
       'Ensayen la demo: con la cabina en el piso 1, aprieten rápido piso 4 bajar, piso 2 subir y piso 3 subir. En FCFS recorre 6 pisos; en LOOK, 3.'],
   pc:[], lab:[]},
];

function openZoom(){ $('#zoomImg').src = TPL; $('#zoom').hidden = false; $('#zoomX').focus(); }
function closeZoom(){ $('#zoom').hidden = true; const b = $('#tplbtn'); if (b) b.focus(); }
let P, cur = 0, cabOff = 10, cabTarget = 10, tween = null, drops = [], hl = 0;
const objs = [];
function isVis(o){ while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function eachMat(o, fn){ (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m && fn(m)); }

function drawLcd(l1, l2, on){
  const g = P.lcdTex.userData.ctx, w = 720, h = 260;
  g.fillStyle = on ? '#2a52cf' : '#17234a'; g.fillRect(0, 0, w, h);
  const cw = (w - 40) / 16, ch = (h - 50) / 2;
  g.font = "bold 58px 'Courier New', monospace"; g.textAlign = 'center'; g.textBaseline = 'middle';
  [l1, l2].forEach((line, r) => { for (let i = 0; i < 16; i++) {
    const x = 20 + i * cw, y = 25 + r * ch;
    g.fillStyle = on ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.03)'; g.fillRect(x + 3, y + 6, cw - 6, ch - 12);
    const c = (line || '')[i]; if (on && c && c !== ' ') { g.fillStyle = '#f2f6ff'; g.fillText(c, x + cw / 2, y + ch / 2 + 2); }
  }});
  P.lcdTex.needsUpdate = true;
}

function camFor(i){
  const [p, t] = STEPS[i].cam, s = (STEPS[i].z || 1.55) * (camera.aspect < 1 ? 1 / Math.pow(camera.aspect, .55) : 1);
  const tv = new THREE.Vector3(...t);
  return [new THREE.Vector3(...p).sub(tv).multiplyScalar(s).add(tv), tv];
}
function fly(i, instant){

}

function show(i, instant){
  const prev = cur; cur = i;
  const n = i === 0 ? STEPS.length - 1 : i;
  objs.forEach(o => { o.visible = o.userData.step <= n; });
  objs.forEach(o => { if (o.isMesh) eachMat(o, m => { if (m.emissive) { m.emissive.setHex(0xff6a10); m.emissiveIntensity = 0; } }); });
  hl = (i > 0 && i < STEPS.length - 1) ? 1.8 : 0;

    objs.forEach(o => {
      if (o.userData.step === i && (!o.parent || o.parent.userData.step !== i) && o.userData.baseY !== undefined) {
        drops.push({o, t: -drops.length * .012});
        o.position.y = o.userData.baseY + 7;
      }
    });
  } else objs.forEach(o => { if (o.userData.baseY !== undefined) o.position.y = o.userData.baseY; });
  const s = STEPS[i];
  if (s.cab !== null) cabTarget = s.cab;
  ride.active = s.cab === null;
  if (ride.active) { ride.k = 0; ride.rec = 0; ride.wait = .6; }

}

function renderUI(){
  const s = STEPS[cur];
  $('#kStep').textContent = cur === 0 ? 'Antes de empezar' : `Paso ${cur} de ${STEPS.length - 1}`;
  $('#kPart').textContent = s.p;
  $('#sTitle').textContent = s.t;
  let html = `<ol>${s.do.map(d => `<li>${d}</li>`).join('')}</ol>`;

  if (s.pc.length) html += `<div class="plabel">Piezas de este paso</div><div class="pieces">${s.pc.map(x => `<span>${x}</span>`).join('')}</div>`;
  if (s.img) html += `<button class="tplbtn" id="tplbtn"><img src="${TPL}" alt="Plantilla de cortes de los dos pliegos"><span>Tocá para ver la plantilla en grande</span></button>`;
  if (s.table) html += `<div class="plabel">Lista de piezas (medidas en cm)</div><div class="tw"><table class="cuts"><thead><tr><th>Letra</th><th>Qué es</th><th>Medida</th><th>Cant.</th></tr></thead><tbody>${s.table.map(r => `<tr><td class="lt">${r[0]}</td><td>${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</tbody></table></div>`;
  if (cur === 0) html += `<p class="tip">También podés usar las flechas del teclado.</p>`;

/* etiquetas que señalan las piezas nuevas */
const labG = new THREE.Group();
function mkLabel(text){

  const w = Math.ceil(g.measureText(text).width) + 40, h = 62, tip = 16;

  g.font = font; g.fillStyle = 'rgba(21,33,29,.94)';
  const r = 18; g.beginPath(); g.moveTo(r, 0); g.arcTo(w, 0, w, h, r); g.arcTo(w, h, 0, h, r); g.arcTo(0, h, 0, 0, r); g.arcTo(0, 0, w, 0, r); g.fill();

    if (!$('#zoom').hidden) return;
    if (e.key === 'ArrowRight' && cur < STEPS.length - 1) show(cur + 1);
    if (e.key === 'ArrowLeft' && cur > 0) show(cur - 1);
  });
  $('#infoX').addEventListener('click', () => { $('#info').hidden = true; });
  $('#zoomX').addEventListener('click', closeZoom);
  $('#zoom').addEventListener('click', e => { if (e.target.id === 'zoom') closeZoom(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#zoom').hidden) closeZoom(); });
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
  canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, t:performance.now()}; tween = null; });
  canvas.addEventListener('pointerup', e => {
    if (!down) return;
    const ok = Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 600; down = null;
    if (!ok) return;
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(scene.children, true).find(h => isVis(h.object) && h.object.userData && h.object.userData.info);
    if (!hit) { $('#info').hidden = true; return; }
    $('#infoT').textContent = hit.object.userData.info.t; $('#infoD').textContent = hit.object.userData.info.d; $('#info').hidden = false;
  });

  let start = 0;
  try { const v = parseInt(localStorage.getItem('armado-ascensor-paso-v2'), 10); if (v >= 0 && v < STEPS.length) start = v; } catch (e) {}
  layout();
  addEventListener('resize', () => { layout(); });
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('#panel'));
  cabOff = STEPS[start].cab === null ? 10 : STEPS[start].cab;
  show(start, true);
  $('#loading').remove();

  let last = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    // piezas nuevas cayendo en su lugar
    if (drops.length) {
      drops = drops.filter(d => {
        d.t += dt / .55; const k = Math.max(0, Math.min(1, d.t)), e = 1 - Math.pow(1 - k, 3);
        d.o.position.y = d.o.userData.baseY + 7 * (1 - e);
        return k < 1;
      });
    }
    // resaltado naranja que se apaga a un tono suave
    if (hl > 0 || cur) {
      hl = Math.max(0, hl - dt);
      const v = cur > 0 && cur < STEPS.length - 1 ? (hl > 0 ? .14 + .22 * Math.sin(hl * 6) ** 2 : .14) : 0;
      objs.forEach(o => { if (o.isMesh && o.userData.step === cur) eachMat(o, m => { if (m.emissive) m.emissiveIntensity = v; }); });
    }
    // cabina
    if (ride.active) {
      if (ride.wait > 0) ride.wait -= dt;
      else {
        const tgt = ride.seq[ride.k % ride.seq.length], d = tgt - cabOff, sp = 10 / 1.6 * dt;
        if (Math.abs(d) <= sp) {
          if (Math.abs(d) > 0) ride.rec++;
          cabOff = tgt; ride.k++; ride.wait = 1.1;
          drawLcd(`Piso ${tgt / 10 + 1}       LOOK`, `Rec:${String(ride.rec).padStart(2, '0')}   PUERTA`, true);
        } else {
          cabOff += Math.sign(d) * sp;
          const dir = Math.sign(d) > 0 ? '^' : 'v';
          if (Math.random() < .05) drawLcd(`Piso ${Math.round(cabOff / 10) + 1} ${dir}     LOOK`, `Rec:${String(ride.rec).padStart(2, '0')}       P:1`, true);
        }
      }
    } else {
      const d = cabTarget - cabOff; cabOff += reduceMotion ? d : d * Math.min(1, dt * 4);
    }
    P.cabinG.position.y = cabOff;
    labG.children.forEach(o => { const l = o.userData.lp; o.position.set(X(l.p[0]), l.p[1] + (l.cab ? cabOff : 0), Z(l.p[2])); });
    const disp = cabOff - 10;
    P.pulleyTop.rotation.z = disp / .955; P.pulleyBot.rotation.z = disp / .955;
    P.texR.offset.y = -disp / .2; P.texL.offset.y = disp / .2;
    P.swLow.cap.position.z = cabOff < .3 ? .42 : .53;
    P.swTop.cap.position.z = cabOff > 29.7 ? .42 : .53;
    if (tween) {
      tween.k = Math.min(1, tween.k + dt / .8);
      const e = 1 - Math.pow(1 - tween.k, 3);
      camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);

    }

  });
}
const fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load(`800 40px ${FONT}`), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(init, init);
})();
