<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascensor de 4 pisos · modelo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dfe5e1; --ink:#15211d; --muted:#586a63; --panel:rgba(255,255,255,.93);
  --line:#ccd7d1; --chip:#edf2ef; --accent:#ea580c; --accent-ink:#ffffff;
  --up:#1f9d55; --down:#d42f2f; --cab:#2563eb; --shadow:0 10px 30px rgba(20,40,32,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111916; --ink:#e6eeea; --muted:#94a69e; --panel:rgba(24,34,30,.93);
    --line:#2c3b35; --chip:#22302a; --accent:#fb7a2e; --accent-ink:#1b0c02;
    --up:#34c77b; --down:#f26464; --cab:#6ea1ff; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#111916; --ink:#e6eeea; --muted:#94a69e; --panel:rgba(24,34,30,.93);
  --line:#2c3b35; --chip:#22302a; --accent:#fb7a2e; --accent-ink:#1b0c02;
  --up:#34c77b; --down:#f26464; --cab:#6ea1ff; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;top:14px;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.title{pointer-events:auto;max-width:34ch}
.title h1{margin:0;font-size:26px;line-height:1.05;font-weight:800;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
.title p{margin:6px 0 0;font-size:13.5px;line-height:1.35;color:var(--muted)}
.views{pointer-events:auto;display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:12px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.views button{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-size:13.5px;font-weight:600}
.views button:hover{background:var(--chip)}

.info{position:absolute;left:16px;top:112px;max-width:min(340px,calc(100% - 32px));background:var(--panel);border-radius:14px;
  box-shadow:var(--shadow);padding:12px 38px 12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-left:4px solid var(--accent)}
.info[hidden]{display:none}
.info b{display:block;font-size:15.5px;font-weight:700;margin-bottom:3px}
.info span{font-size:13.5px;line-height:1.4;color:var(--muted)}
.info button{position:absolute;top:6px;right:6px;border:0;background:transparent;width:28px;height:28px;border-radius:8px;font-size:18px;line-height:1;color:var(--muted)}

.panel{position:absolute;top:16px;right:16px;width:350px;max-height:calc(100% - 32px);overflow:auto;background:var(--panel);
  border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 4px}
.seg{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{text-align:right;line-height:1}
.count strong{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count small{font-size:12px;color:var(--muted)}
.desc{margin:4px 16px 10px;font-size:13.5px;line-height:1.4;color:var(--muted);max-width:44ch}
.grid{display:grid;grid-template-columns:62px repeat(4,1fr);gap:6px;padding:0 16px;align-items:center}
.grid .h{font-size:12.5px;color:var(--muted);text-align:center}
.grid .l{font-size:13px;color:var(--muted)}
.grid button{border:1px solid var(--line);background:transparent;height:38px;border-radius:10px;font-weight:700;font-size:15px}
.grid button.on.up{background:var(--up);border-color:var(--up);color:#fff}
.grid button.on.dn{background:var(--down);border-color:var(--down);color:#fff}
.grid button.on.cab{background:var(--cab);border-color:var(--cab);color:#fff}
.demo{margin:14px 16px 0;display:flex;flex-direction:column;gap:8px}
.demo button{border:0;background:var(--accent);color:var(--accent-ink);padding:12px 14px;border-radius:12px;font-weight:700;font-size:15px;text-align:left}
.demo button small{display:block;font-weight:400;font-size:12.5px;opacity:.85;margin-top:2px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.res div{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.res div strong{display:block;color:var(--ink);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.log{list-style:none;margin:12px 0 0;padding:10px 16px 16px;border-top:1px solid var(--line);min-height:92px}
.log li{font-size:13px;line-height:1.35;color:var(--muted);padding:3px 0}
.log li:first-child{color:var(--ink);font-weight:600}
.toggle{display:none}

.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--muted);pointer-events:none}

@media (max-width:760px){
  .title h1{font-size:22px}
  .title p{font-size:12.5px}
  .top{top:10px;left:12px;right:12px}
  .views{order:3}
  .views button{padding:6px 9px;font-size:12.5px}
  .info{top:auto;bottom:calc(var(--ph,300px) + 20px);left:12px}
  .panel{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:62%}
  .toggle{display:block;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:8px}
  .panel.min .body{display:none}
  .count strong{font-size:32px}
  .grid button{height:34px}
  .log{min-height:0}
  .log li:nth-child(n+3){display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Modelo 3D del ascensor. Arrastrá para girar."></canvas>
<div class="loading" id="loading">Cargando el modelo…</div>

<header class="top">
  <div class="title">
    <h1>Ascensor de 4 pisos</h1>
    <p>Arrastrá para girar y pellizcá para acercar. Tocá una pieza para ver qué es, o los botones para llamar al ascensor.</p>
  </div>
  <nav class="views" aria-label="Vistas">
    <button data-view="inicio">Inicio</button>
    <button data-view="frente">Frente</button>
    <button data-view="lado">Lado</button>
    <button data-view="atras">Atrás</button>
    <button data-view="arriba">Arriba</button>
  </nav>
</header>

<div class="info" id="info" hidden role="status">
  <b id="infoT"></b><span id="infoD"></span>
  <button id="infoX" aria-label="Cerrar">×</button>
</div>

<section class="panel" id="panel" aria-label="Controles del ascensor">
  <div class="panel-head">
    <div class="seg" role="group" aria-label="Algoritmo">
      <button data-mode="FCFS" aria-pressed="false">FCFS</button>
      <button data-mode="LOOK" aria-pressed="true">LOOK</button>
    </div>
    <div class="count"><strong id="count">00</strong><small>pisos recorridos</small></div>
    <button class="toggle" id="toggle" aria-expanded="true">Ocultar</button>
  </div>
  <div class="body">
    <p class="desc" id="desc"></p>
    <div class="grid" id="grid"></div>
    <div class="demo">
      <button id="demo">Correr la demo<small>Desde el piso 1: piso 4 bajar, piso 2 subir, piso 3 subir</small></button>
      <div class="res">
        <div>FCFS<strong id="rF">–</strong></div>
        <div>LOOK<strong id="rL">–</strong></div>
      </div>
    </div>
    <ol class="log" id="log" aria-live="polite"></ol>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE || !THREE.OrbitControls) {
  $('#loading').textContent = 'No se pudo cargar el visor 3D. Revisá tu conexión y recargá la página.';
  return;
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- escena ---------- */
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
function applyBg(){ scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#dfe5e1'); }
applyBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyBg);

const camera = new THREE.PerspectiveCamera(36, 1, 1, 1200);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 22;
controls.maxDistance = 260;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xffffff, 0x40524b, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(45, 85, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-55, right:55, top:65, bottom:-45, near:10, far:260});
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(-60, 35, -45);
scene.add(fill);

/* ---------- utilidades (1 unidad = 1 cm) ----------
   x: 0..45 de izquierda a derecha de la base
   h: altura sobre la base
   d: 0 (frente) .. 30 (atrás) */
const X = x => x - 22.5, Z = d => 15 - d;
const std = (c, r, m) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m || 0});
const M = {
  foam: std(0xf4f4f0, .92), foam2: std(0xe9e9e4, .92),
  rod: std(0x7d848b, .32, .9), steel: std(0xbfc4c9, .3, .9), copper: std(0xc4722c, .32, .85),
  alu: std(0xd3d7db, .28, .85), belt: std(0x202023, .85), motor: std(0xb3bbc2, .38, .75),
  motorCap: std(0x2e63c8, .55), pcbBlue: std(0x1a5ea8, .55), pcbGreen: std(0x1f6a3b, .6),
  black: std(0x1c1c1e, .55), white: std(0xf7f7f4, .7), cabin: std(0xfccf9c, .85), cabinIn: std(0xfff0dd, .9),
  clip: std(0x141416, .35, .6), silicone: new THREE.MeshStandardMaterial({color:0xffffff, roughness:.2, transparent:true, opacity:.55}),
  btnBody: std(0x2a2a2d, .5), term: std(0x2f8a4e, .6), cream: std(0xfff7e8, .8), marker: std(0x222222, .8), red: std(0xd33a2c, .5)
};
const shadow = m => { m.castShadow = true; m.receiveShadow = true; return m; };
function box(x1, x2, h1, h2, d1, d2, mat, info, parent){
  const m = shadow(new THREE.Mesh(new THREE.BoxGeometry(x2 - x1, h2 - h1, d2 - d1), mat));
  m.position.set(X((x1 + x2) / 2), (h1 + h2) / 2, Z((d1 + d2) / 2));
  if (info) m.userData.info = info;
  (parent || scene).add(m); return m;
}
function cylY(x, d, h1, h2, r, mat, info, parent, seg){
  const m = shadow(new THREE.Mesh(new THREE.CylinderGeometry(r, r, h2 - h1, seg || 24), mat));
  m.position.set(X(x), (h1 + h2) / 2, Z(d));
  if (info) m.userData.info = info;
  (parent || scene).add(m); return m;
}
function cylZ(x, h, d1, d2, r, mat, info, parent, seg){
  const g = new THREE.CylinderGeometry(r, r, d2 - d1, seg || 28); g.rotateX(Math.PI / 2);
  const m = shadow(new THREE.Mesh(g, mat));
  m.position.set(X(x), h, Z((d1 + d2) / 2));
  if (info) m.userData.info = info;
  (parent || scene).add(m); return m;
}
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.userData = {canvas:c, ctx:g};
  return t;
}
const FONT = "'Bricolage Grotesque', system-ui, sans-serif";

function pbTex(wcm, hcm, o){
  o = o || {};
  const k = 48;
  return canvasTex(Math.round(wcm * k), Math.round(hcm * k), (g, w, h) => {
    g.fillStyle = '#f8f8f5'; g.fillRect(0, 0, w, h);
    const p = 0.254 * k;
    g.fillStyle = '#e2e2dc'; g.fillRect(0, h / 2 - .12 * k, w, .24 * k);
    g.fillStyle = '#4a4a4a';
    const hole = (x, y) => g.fillRect(x - 1.7, y - 1.7, 3.4, 3.4);
    const cols = Math.floor((w - .3 * k) / p);
    const x0 = (w - cols * p) / 2 + p / 2;
    for (let i = 0; i < cols; i++) for (let r = 0; r < 5; r++) {
      hole(x0 + i * p, h / 2 - .3 * k - r * p); hole(x0 + i * p, h / 2 + .3 * k + r * p);
    }
    if (o.rails) {
      [[.18, '#d33a2c'], [h / k - .18, '#2563eb']].forEach(([yc, col]) => {
        const y = yc * k;
        g.fillStyle = col; g.fillRect(.2 * k, y - (yc < 1 ? -.02 : .02) * k - 1, w - .4 * k, 2);
      });
      g.fillStyle = '#4a4a4a';
      for (let i = 0; i < cols; i += 1) { if (i % 6 === 5) continue; hole(x0 + i * p, .4 * k); hole(x0 + i * p, .4 * k + p); hole(x0 + i * p, h - .4 * k); hole(x0 + i * p, h - .4 * k - p); }
    }
    if (o.draw) o.draw(g, k, w, h);
  });
}

/* ---------- la maqueta ---------- */
const I = (t, d) => ({t, d});
const INFO = {
  base: I('Base A', 'Dos piezas de 45 × 30 cm pegadas una encima de otra: queda de 1 cm de grueso.'),
  B: I('Panel trasero B', '20 × 48 cm. La línea del centro guía el motor, las dos poleas y la faja.'),
  C: I('Lateral C', '10 × 48 cm. En el derecho van por fuera los botones de pasillo y las etiquetas de piso.'),
  D: I('Techo D', '20.5 × 10.5 cm. Las dos varillas lo atraviesan.'),
  E: I('Tablero E', '20 × 10 cm, parado en la esquina de adelante. Tiene la ventana del LCD y los botones de cabina.'),
  F: I('Escuadra F', 'Triángulo de 8 × 8 cm que sostiene el tablero por detrás.'),
  rod: I('Varilla de hierro liso 1/4"', 'Tramo de 50 cm, lijado con grano 400. Es el riel: la cabina desliza por ella.'),
  guide: I('Guía de cobre 3/8"', 'Pedazo de 3 cm pegado al costado de la cabina. La varilla pasa por dentro.'),
  cabin: I('Cabina (G, H, I)', 'Cajita de 10 × 7 × 6 cm con el frente abierto.'),
  J: I('Pestaña J', '2 × 3.5 cm, pegada atrás de la cabina. Aquí se engancha la faja.'),
  clip: I('Clip binder de 19 mm', 'Aprieta el lado derecho de la faja contra la pestaña J. Así la faja arrastra la cabina.'),
  belt: I('Faja GT2 de 852 mm', 'Lazo cerrado de 6 mm de ancho. Solo el lado derecho va enganchado a la cabina.'),
  pulleyTop: I('Polea GT2 de 30 dientes (arriba)', 'Fija al eje del motor con sus dos tornillitos, a 1 mm del motor.'),
  pulleyBot: I('Polea GT2 de 30 dientes (abajo)', 'Sin tornillitos: gira libre sobre el tornillo M5 con una gota de aceite.'),
  bolt: I('Tornillo M5 con 3 tuercas', 'La tuerca 2 ajusta la distancia para que las dos poleas queden en el mismo plano.'),
  K: I('Cuadritos K', '3 × 3 cm. Refuerzan el cartón donde entra el tornillo.'),
  motor: I('Motor 28BYJ-48 de 5 V', 'Eje a 44 cm de la base, sobre la línea del centro de B.'),
  L: I('Repisa L', 'El motor se sienta sobre ella. Solo debe sobresalir 2 cm de B para no rozar la faja.'),
  driver: I('Driver ULN2003', 'Pegado atrás de B por las esquinas. Se alimenta con la fuente de 5 V, nunca con la de 9 V.'),
  lowSw: I('Final de carrera de abajo', 'Torrecita de 12 cuadritos K con un botón. La cabina lo aprieta en el piso 1 (pin 35).'),
  topSw: I('Final de carrera de arriba', 'Cuelga del techo. La cabina lo aprieta en el piso 4 (pin 36).'),
  label: I('Etiqueta de piso M', '4 × 2.5 cm, pegada sobre la línea de marcador de cada piso.'),
  lcd: I('LCD 16x2 con módulo I2C', 'Pines 20 (SDA) y 21 (SCL). Muestra piso, dirección, modo y pisos recorridos.'),
  pbCab: I('Protoboard de los botones de cabina', 'Destinos 1 a 4 (pines 30 a 33) y MODO (pin 34).'),
  mega: I('Arduino Mega 2560', 'Se alimenta por USB o con el adaptador Elegoo de 9 V en su jack.'),
  pbMain: I('Protoboard principal', 'La fila azul es la tierra común (GND) de los 13 botones.'),
  psu: I('Fuente de 5 V 2 A con bornera', 'Alimenta solo al driver del motor. Su negativo va también a la fila GND.'),
  adapter: I('Adaptador Elegoo de 9 V', 'Va solo al jack del Mega. Nunca al driver del motor.'),
  wire: I('Jumper', 'Todos los botones van con la señal y el GND en diagonal.')
};

function build(){
  // tapete de corte
  const matTex = canvasTex(1080, 780, (g, w, h) => {
    const k = 12;
    g.fillStyle = '#2d5b4d'; g.fillRect(0, 0, w, h);
    for (let i = 0; i <= 90; i++) { g.strokeStyle = i % 10 === 0 ? 'rgba(255,255,255,.34)' : i % 5 === 0 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.07)'; g.lineWidth = i % 10 === 0 ? 2 : 1; g.beginPath(); g.moveTo(i * k + .5, 0); g.lineTo(i * k + .5, h); g.stroke(); }
    for (let j = 0; j <= 65; j++) { g.strokeStyle = j % 10 === 0 ? 'rgba(255,255,255,.34)' : j % 5 === 0 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.07)'; g.lineWidth = j % 10 === 0 ? 2 : 1; g.beginPath(); g.moveTo(0, j * k + .5); g.lineTo(w, j * k + .5); g.stroke(); }
    g.strokeStyle = 'rgba(255,214,102,.28)'; g.lineWidth = 1.5;
    for (let a = -h; a < w; a += 240) { g.beginPath(); g.moveTo(a, h); g.lineTo(a + h, 0); g.stroke(); }
  });
  const matSide = std(0x24493e, .9);
  const mat = new THREE.Mesh(new THREE.BoxGeometry(90, .3, 65), [matSide, matSide, new THREE.MeshStandardMaterial({map:matTex, roughness:.95}), matSide, matSide, matSide]);
  mat.position.set(0, -1.15, 1); mat.receiveShadow = true; scene.add(mat);

  // base doble
  box(0, 45, -1, -.5, 0, 30, M.foam2, INFO.base);
  box(0, 45, -.5, 0, 0, 30, M.foam, INFO.base);

  // torre en U
  box(23, 43, 0, 48, 19.5, 20, M.foam, INFO.B);
  box(23, 23.5, 0, 48, 9.5, 19.5, M.foam, INFO.C);
  box(42.5, 43, 0, 48, 9.5, 19.5, M.foam, INFO.C);
  box(22.75, 43.25, 48, 48.5, 9.5, 20, M.foam, INFO.D);
  // línea del centro a lápiz
  box(32.97, 33.03, 1, 47.5, 19.49, 19.5, std(0x9aa0a6, .9), INFO.B);

  // varillas
  [27.3, 38.7].forEach(x => cylY(x, 12.2, -.6, 49.2, .3175, M.rod, INFO.rod));

  // motor + repisa + polea de arriba
  box(30, 36, 41.3, 41.8, 17.5, 19.5, M.foam2, INFO.L);
  cylZ(33, 43.2, 17.6, 19.2, 1.4, M.motor, INFO.motor, null, 40);
  cylZ(33, 43.2, 19.2, 19.5, 1.42, M.motorCap, INFO.motor, null, 40);
  box(29.8, 36.2, 42.85, 43.55, 17.55, 17.65, M.motor, INFO.motor);
  cylZ(33, 44, 17.3, 17.6, .45, M.motor, INFO.motor);
  cylZ(33, 44, 16, 17.3, .25, std(0xc9a44a, .35, .8), INFO.motor);

  const pulleyTop = makePulley(44, true, INFO.pulleyTop);
  const pulleyBot = makePulley(4.4, false, INFO.pulleyBot);

/* ---------- simulación: FCFS vs LOOK ---------- */
const T_FLOOR = 1.7, T_DOOR = 1.3;
const S = {pos:1, dir:0, state:'idle', target:0, door:0, mode:'LOOK', count:0,
  cab:[0,0,0,0,0], up:[0,0,0,0,0], dn:[0,0,0,0,0], queue:[], demo:null, res:{FCFS:null, LOOK:null}, t:0, sched:[]};
const cur = () => Math.round(S.pos);
const any = f => S.cab[f] || S.up[f] || S.dn[f];
const hasAny = () => [1,2,3,4].some(any);
const ahead = (f, d) => { for (let p = f + d; p >= 1 && p <= 4; p += d) if (any(p)) return true; return false; };
const later = (dt, fn) => S.sched.push({at:S.t + dt, fn});

function call(type, f){
  if ((type === 'up' && f === 4) || (type === 'dn' && f === 1) || S[type][f]) return;
  S[type][f] = 1; S.queue.push({type, f});
  log(type === 'cab' ? `Cabina: destino piso ${f}` : `Piso ${f}: alguien quiere ${type === 'up' ? 'subir' : 'bajar'}`);
  lights();
}
function clr(type, f){ S[type][f] = 0; S.queue = S.queue.filter(q => !(q.type === type && q.f === f)); }
function clrAll(f){ ['cab','up','dn'].forEach(t => clr(t, f)); }
function openDoor(f, msg){ S.state = 'door'; S.door = T_DOOR; S.pos = f; log(msg); lights(); }

function decide(){
  const f = cur();
  if (S.mode === 'FCFS') {
    const h = S.queue[0];
    if (!h) { S.dir = 0; return; }
    if (h.f === f) { S.queue.filter(q => q.f === f).forEach(q => clr(q.type, f)); openDoor(f, `Abre en el piso ${f}: era el primero de la cola`); return; }
    S.target = h.f; S.dir = Math.sign(h.f - f); S.state = 'move';
    log(`Va al piso ${h.f} porque es el primero de la cola`);
    return;
  }
  if (any(f)) { clrAll(f); openDoor(f, `Abre en el piso ${f}: lo llamaron aquí mismo`); return; }
  if (!hasAny()) { S.dir = 0; return; }
  let d = S.dir;
  if (!(d && ahead(f, d))) {
    if (d && ahead(f, -d)) d = -d;
    else { let best = 0; for (let p = 1; p <= 4; p++) if (any(p) && (!best || Math.abs(p - f) < Math.abs(best - f))) best = p; d = Math.sign(best - f); }
  }
  if (d !== S.dir) log(d > 0 ? 'Empieza a subir' : 'Empieza a bajar');
  S.dir = d; S.state = 'move';
}

function arrive(f){
  if (S.state === 'home') { if (f === 1) { S.state = 'idle'; S.dir = 0; startDemo(); } return; }
  S.count++;
  if (S.mode === 'FCFS') {
    const tgtAhead = S.target && Math.sign(S.target - f) === S.dir;
    if (f === S.target || !tgtAhead) {
      const here = S.queue.filter(q => q.f === f);
      if (here.length) { here.forEach(q => clr(q.type, f)); openDoor(f, `Para en el piso ${f}: le tocaba en la cola`); }
      else { S.state = 'idle'; }
    } else if (any(f)) log(`Pasa de largo el piso ${f}: alguien espera, pero FCFS solo atiende al primero de la cola`);
    return;
  }
  const d = S.dir, more = ahead(f, d);
  let why = null;
  if (S.cab[f]) why = 'alguien en la cabina pidió este piso';
  else if (d > 0 && S.up[f]) why = 'va subiendo y aquí quieren subir';
  else if (d < 0 && S.dn[f]) why = 'va bajando y aquí quieren bajar';
  else if (!more && any(f)) why = `no queda nadie más ${d > 0 ? 'arriba' : 'abajo'}, así que aquí da la vuelta`;
  if (why) {
    clr('cab', f); clr(d > 0 ? 'up' : 'dn', f);
    if (!more) { clrAll(f); S.dir = 0; }
    openDoor(f, `Para en el piso ${f}: ${why}`);
  } else if (!more) { S.state = 'idle'; S.dir = 0; }
  else if (any(f)) log(`Pasa el piso ${f}: ahí quieren ${S.up[f] ? 'subir' : 'bajar'}, pero va ${d > 0 ? 'subiendo' : 'bajando'}`);
}

function step(dt){
  S.t += dt;
  S.sched = S.sched.filter(s => { if (S.t >= s.at) { s.fn(); return false; } return true; });
  if (S.state === 'move' || S.state === 'home') {
    const prev = S.pos;
    S.pos += S.dir * dt / T_FLOOR;
    const next = S.dir > 0 ? Math.floor(prev + 1e-6) + 1 : Math.ceil(prev - 1e-6) - 1;
    if (next < 1 || next > 4) { S.pos = Math.min(4, Math.max(1, S.pos)); S.state = 'idle'; S.dir = 0; }
    else if ((S.dir > 0 && S.pos >= next) || (S.dir < 0 && S.pos <= next)) { S.pos = next; arrive(next); }
  } else if (S.state === 'door') {
    S.door -= dt;
    if (S.door <= 0) S.state = 'idle';
  }
  if (S.state === 'idle') {
    decide();
    if (S.demo && S.demo.fired && S.state === 'idle' && !hasAny()) {
      S.res[S.demo.mode] = S.count;
      log(`Demo terminada en ${S.demo.mode}: ${S.count} pisos recorridos`);
      S.demo = null; results();
    }
  }
}

function runDemo(){
  ['cab','up','dn'].forEach(t => S[t] = [0,0,0,0,0]); S.queue = []; S.sched = [];
  S.demo = {mode:S.mode, fired:false};
  lights();
  if (Math.abs(S.pos - 1) < 1e-6 && S.state !== 'move') { S.state = 'idle'; startDemo(); }
  else { log(`Demo en ${S.mode}: primero regresa al piso 1`); S.state = 'home'; S.dir = -1; }
}
function startDemo(){
  S.count = 0;
  log(`Demo en ${S.mode}: llegan tres llamadas seguidas`);
  later(.05, () => call('dn', 4));
  later(.45, () => call('up', 2));
  later(.85, () => { call('up', 3); if (S.demo) S.demo.fired = true; });
}
function setMode(m){
  if (m === S.mode) return;
  S.mode = m; S.count = 0;
  if (S.demo && S.state !== 'home') S.demo = null;
  if (S.demo) S.demo.mode = m;
  if (m === 'FCFS' && S.state === 'move') S.target = S.queue[0] ? S.queue[0].f : 0;
  log(`Modo ${m}. El contador vuelve a cero.`);
  ui.modeButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  ui.desc.textContent = DESC[m];
}
const DESC = {
  FCFS:'Atiende en orden de llegada. Pasa de largo frente a quien espera si no es su turno.',
  LOOK:'Mantiene su dirección y recoge todo lo que le queda de paso. Da la vuelta cuando ya no hay nadie adelante.'
};

/* ---------- interfaz ---------- */
const ui = {modeButtons:[...document.querySelectorAll('[data-mode]')], desc:$('#desc'), count:$('#count'), log:$('#log'), btn:{up:[], dn:[], cab:[]}};
const logs = [];
function log(t){ logs.unshift(t); logs.length = Math.min(logs.length, 4); ui.log.innerHTML = logs.map(x => `<li>${x}</li>`).join(''); }
function results(){ $('#rF').textContent = S.res.FCFS == null ? '–' : S.res.FCFS + ' pisos'; $('#rL').textContent = S.res.LOOK == null ? '–' : S.res.LOOK + ' pisos'; }

function buildGrid(){
  const g = $('#grid');
  const cell = (html, cls) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; g.appendChild(d); };
  cell('', 'h'); for (let n = 1; n <= 4; n++) cell('Piso ' + n, 'h');
  [['up', 'Subir', '▲'], ['dn', 'Bajar', '▼'], ['cab', 'Cabina', '']].forEach(([type, lab, sym]) => {
    cell(lab, 'l');
    for (let n = 1; n <= 4; n++) {
      if ((type === 'up' && n === 4) || (type === 'dn' && n === 1)) { cell('', ''); continue; }
      const b = document.createElement('button');
      b.className = type; b.textContent = sym || String(n);
      b.setAttribute('aria-label', type === 'cab' ? `Cabina, destino piso ${n}` : `Piso ${n}, ${lab.toLowerCase()}`);
      b.addEventListener('click', () => press({type, f:n}));
      g.appendChild(b); ui.btn[type][n] = b;
    }
  });
}
let P;
function lights(){
  ['up','dn','cab'].forEach(t => {
    for (let n = 1; n <= 4; n++) {
      const on = !!S[t][n];
      if (ui.btn[t][n]) { ui.btn[t][n].classList.toggle('on', on); ui.btn[t][n].setAttribute('aria-pressed', String(on)); }
      const b = t === 'cab' ? P.cabBtn[n] : P.hall[t][n];
      if (b) b.capMat.emissiveIntensity = on ? .85 : 0;
    }
  });
}
function press(p, btn){
  if (p.mode) { setMode(S.mode === 'LOOK' ? 'FCFS' : 'LOOK'); if (P) P.modeBtn.t = .18; return; }
  call(p.type, p.f);
  const b = p.type === 'cab' ? P.cabBtn[p.f] : P.hall[p.type][p.f];
  if (b) b.t = .18;
}

let lastLcd = '';
function drawLcd(){
  const f = cur();
  const arrow = S.state === 'move' || S.state === 'home' ? (S.dir > 0 ? '^' : 'v') : ' ';
  const pend = S.queue.length;
  const l1 = (`Piso ${f} ${arrow}`).padEnd(11) + S.mode.padStart(5);
  const l2 = (`Rec:${String(S.count).padStart(2, '0')}` + (S.state === 'door' ? ' PUERTA' : '')).padEnd(13) + `P:${Math.min(pend, 9)}`;
  const txt = l1 + '|' + l2;
  if (txt === lastLcd) return; lastLcd = txt;
  const g = P.lcdTex.userData.ctx, w = 720, h = 260;
  g.fillStyle = '#2a52cf'; g.fillRect(0, 0, w, h);
  const cw = (w - 40) / 16, ch = (h - 50) / 2;
  g.font = "bold 58px 'Courier New', monospace"; g.textAlign = 'center'; g.textBaseline = 'middle';
  [l1, l2].forEach((line, r) => {
    for (let i = 0; i < 16; i++) {
      const x = 20 + i * cw, y = 25 + r * (ch + 0) ;
      g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(x + 3, y + 6, cw - 6, ch - 12);
      const c = line[i] || ' ';
      if (c !== ' ') { g.fillStyle = '#f2f6ff'; g.fillText(c, x + cw / 2, y + ch / 2 + 2); }
    }
  });
  P.lcdTex.needsUpdate = true;
  ui.count.textContent = String(S.count).padStart(2, '0');
}

/* ---------- cámara ---------- */
const VIEWS = {
  inicio:{p:[58, 46, 80], t:[3, 21, 0]},
  frente:{p:[3, 28, 98], t:[3, 22, 0]},
  lado:{p:[100, 30, 6], t:[3, 22, 2]},
  atras:{p:[-14, 36, -92], t:[3, 18, 0]},
  arriba:{p:[1, 120, 16], t:[1, 0, 2]}
};
let tween = null;
function distScale(){ const a = camera.aspect; return a < 1 ? 1 / Math.pow(a, .62) : 1; }
function goView(name, instant){
  const v = VIEWS[name], s = distScale();
  const t = new THREE.Vector3(...v.t);
  const p = new THREE.Vector3(...v.p).sub(t).multiplyScalar(s).add(t);
  if (instant || reduceMotion) { camera.position.copy(p); controls.target.copy(t); controls.update(); tween = null; return; }
  tween = {p0:camera.position.clone(), t0:controls.target.clone(), p1:p, t1:t, k:0};
}

function layout(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const r = $('#panel').getBoundingClientRect();
  document.documentElement.style.setProperty('--ph', r.height + 'px');
  if (r.width > w * .6) camera.setViewOffset(w, h, 0, Math.round(r.height * .42), w, h);
  else camera.setViewOffset(w, h, Math.round((r.width + 16) / 2), 0, w, h);
  camera.updateProjectionMatrix();
}

/* ---------- selección ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, t:performance.now()}; tween = null; });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved > 6 || performance.now() - down.t > 600) { down = null; return; }
  down = null;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => h.object.userData && (h.object.userData.info || h.object.userData.press));
  if (!hit) { $('#info').hidden = true; return; }
  const u = hit.object.userData;
  if (u.press) press(u.press);
  if (u.info) showInfo(u.info);
});
function showInfo(i){ $('#infoT').textContent = i.t; $('#infoD').textContent = i.d; $('#info').hidden = false; }
$('#infoX').addEventListener('click', () => { $('#info').hidden = true; });

/* ---------- arranque ---------- */
function init(){
  P = build();
  buildGrid();
  ui.modeButtons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
  $('#demo').addEventListener('click', runDemo);
  $('#toggle').addEventListener('click', () => {
    const p = $('#panel'), min = p.classList.toggle('min');
    $('#toggle').textContent = min ? 'Mostrar' : 'Ocultar';
    $('#toggle').setAttribute('aria-expanded', String(!min));
    layout();
  });
  ui.desc.textContent = DESC[S.mode];
  log('Listo en el piso 1. Probá la demo o llamá al ascensor.');
  results(); lights();
  layout(); goView('inicio', true);
  addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('#panel'));
  $('#loading').remove();
  let last = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    step(dt);
    const disp = (S.pos - 1) * 10;
    P.cabinG.position.y = disp;
    P.pulleyTop.rotation.z = disp / .955;
    P.pulleyBot.rotation.z = disp / .955;
    P.texR.offset.y = -disp / .2;
    P.texL.offset.y = disp / .2;
    [P.modeBtn, ...P.cabBtn.slice(1), ...P.hall.up.filter(Boolean), ...P.hall.dn.filter(Boolean)].forEach(b => {
      if (b.t > 0) b.t -= dt;
      b.cap.position.z = b.t > 0 ? .44 : .53;
    });
    P.swLow.cap.position.z = S.pos < 1.02 ? .42 : .53;
    P.swTop.cap.position.z = S.pos > 3.98 ? .34 : .53;
    drawLcd();
    if (tween) {
      tween.k = Math.min(1, tween.k + dt / .7);
      const e = 1 - Math.pow(1 - tween.k, 3);
      camera.position.lerpVectors(tween.p0, tween.p1, e);
      controls.target.lerpVectors(tween.t0, tween.t1, e);
      if (tween.k >= 1) tween = null;
    }
    controls.update();
    renderer.render(scene, camera);
  });
}
const fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load(`800 40px ${FONT}`), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(init, init);
})();
</script>
</body>
